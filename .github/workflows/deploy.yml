name: Deploy Backend to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/niduscareer/backend
            git checkout master
            git pull origin master
            
            cd /opt/niduscareer
            # Rebuild and restart all backend containers
            sudo docker compose build api asgi worker beat fastapi
            sudo docker compose up -d --force-recreate api asgi worker beat fastapi
            
            # Apply migrations and push static files to S3
            sudo docker compose run --rm api python manage.py migrate --noinput
            sudo docker compose run --rm api python manage.py collectstatic --noinput
            
            # Clean up old docker images to save disk space
            sudo docker image prune -f
            echo "✅ Backend deployment successful!"
