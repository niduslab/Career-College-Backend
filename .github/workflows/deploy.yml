name: Deploy Backend to EC2

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Backend via SSH
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            set -e
            cd /opt/niduscareer/backend
            git checkout master
            git pull origin master
            cd /opt/niduscareer
            sudo docker compose build api asgi worker beat fastapi
            sudo docker compose up -d --force-recreate api asgi worker beat fastapi
            sudo docker compose run --rm api python manage.py migrate --noinput
            sudo docker compose run --rm api python manage.py collectstatic --noinput
            sudo docker image prune -f
          "
