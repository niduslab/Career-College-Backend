name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_college_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      SITE_ID: "1"
      TIME_ZONE: UTC
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: career_college_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CHANNEL_LAYERS_URL: redis://127.0.0.1:6379/2
      FRONTEND_URL: http://localhost:3000
      JWT_COOKIE_SECURE: "False"
      FFMPEG_BINARY_PATH: ffmpeg
      FFPROBE_BINARY_PATH: ffprobe
      SSLCOMMERZ_STORE_ID: testbox
      SSLCOMMERZ_STORE_PASSWORD: qwerty
      SSLCOMMERZ_SANDBOX: "True"
      BACKEND_URL: http://localhost:8000
      RUNNER_IMAGE_PYTHON: python:3.12-slim
      RUNNER_IMAGE_JAVASCRIPT: node:20-slim
      RUNNER_IMAGE_CPP: gcc:13
      RUNNER_IMAGE_JAVA: eclipse-temurin:21
      RUNNER_RUNTIME_PROD: runc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Generate migrations
        run: python manage.py makemigrations

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test
