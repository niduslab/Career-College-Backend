<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
  .wrapper { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; }
  .header { background: #1a1a2e; padding: 24px 32px; }
  .header h1 { color: #fff; margin: 0; font-size: 20px; }
  .content { padding: 32px; color: #333; line-height: 1.6; }
  .content h2 { margin-top: 0; color: #1a1a2e; }
  .footer { padding: 24px 32px; background: #f9f9f9; border-top: 1px solid #eee; font-size: 12px; color: #888; }
  .btn { display: inline-block; margin-top: 16px; padding: 12px 24px; background: #1a1a2e; color: #fff; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>Career College</h1>
  </div>
  <div class="content">
    {% block content %}
    <h2>{{ title }}</h2>
    <p>{{ body }}</p>
    {% endblock %}
  </div>
  <div class="footer">
    <p>You are receiving this email because you have an account on Career College. To manage your notification preferences, visit your account settings.</p>
  </div>
</div>
</body>
</html>
